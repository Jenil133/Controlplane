# Production: namespace controlplane, with external PostgreSQL and Redis.
#
# The namespace and the controlplane-secrets Secret are managed outside this
# overlay, so kubectl delete -k never removes them. Create the Secret with
# your secret manager, or by hand:
#
#   kubectl -n controlplane create secret generic controlplane-secrets \
#     --from-literal=database-url='postgres://USER:PASSWORD@HOST:5432/controlplane?sslmode=verify-full' \
#     --from-literal=redis-url='rediss://:PASSWORD@HOST:6379/0' \
#     --from-file=tokens.json
#
# tokens.json holds token hashes only, {"tokens":[{"name":..,"role":..,"token_sha256":..}]};
# `cpctl token generate --name NAME --role ROLE` prints a new token and its
# entry. Changing the Secret takes effect when the pods restart.
#
# The base deploys ghcr.io/jenil133/controlplane:latest. Pin a release tag or
# digest here (images: newTag or digest) before relying on this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: controlplane

resources:
  - ../../base
